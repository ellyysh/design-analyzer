<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Вход в админку</title>
<style>
    body { font-family: system-ui; background: #f1f5f9; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .card { background: white; padding: 32px; border-radius: 24px; width: 300px; }
    input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 12px; border: 1px solid #cbd5e1; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 40px; }
    .error { color: red; }
</style>
</head>
<body>
<div class="card">
    <h2>Вход в админ-панель</h2>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
